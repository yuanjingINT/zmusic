name: zmusic
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: yuanjing <yuanjing@yuanjing.art>
description: 网易云音乐终端播放器（Rust / ratatui TUI）
