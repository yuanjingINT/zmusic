name: build-packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
            goarch: amd64
          - target: aarch64
            runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package (deb / rpm / archlinux)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_2.41.3_linux_${{ matrix.goarch }}.tar.gz \
            | tar -xz -C /usr/local/bin nfpm
          nfpm -v
          for fmt in deb rpm archlinux; do
            nfpm package -f packaging/nfpm.yaml -p "$fmt" \
              -t dist/zmusic_${GITHUB_REF_NAME}_${{ matrix.target }}.$fmt
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmusic-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
