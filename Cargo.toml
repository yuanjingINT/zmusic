[package]
name = "zmuse"
version = "0.1.1"
edition = "2021"
description = "zmuse - NetEase Cloud Music terminal player for Linux"

[[bin]]
name = "zmuse"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
anyhow = "1"
dirs = "6"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
# opt-level="z" + fat LTO：实测 3,030,096 → 2,045,808 B（-32.5%），
# 启动中位 119.7 → 120.0ms、搜索上屏 6–11ms，都在噪声内（启动由 mpv 的 120ms 主导）
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
